<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VIL Canvas - Handwriting Note</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --primary: #10b981;
      --primary-light: rgba(16, 185, 129, 0.15);
      --text: #f9fafb;
      --sub-text: #9ca3af;
      --border: #2a354d;
      --accent-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Splash Screen (2.2秒) */
    #splash {
      position: fixed; inset: 0;
      background: radial-gradient(circle at center, #1a263d 0%, #080b12 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999; transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #splash.fade-out { opacity: 0; pointer-events: none; }
    .splash-icon { font-size: 3rem; margin-bottom: 10px; filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.4)); }
    .splash-logo {
      font-size: 2.8rem; font-weight: 900; letter-spacing: 0.25em;
      background: linear-gradient(135deg, #ffffff 0%, var(--primary) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px;
    }
    .splash-sub { font-size: 0.8rem; color: var(--sub-text); letter-spacing: 0.3em; font-weight: 600; text-transform: uppercase; }

    /* App Container */
    .app-container {
      display: flex; flex-direction: column; height: 100dvh; max-width: 600px; margin: 0 auto; padding: 10px; gap: 10px;
    }

    /* Header */
    header {
      display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; flex-shrink: 0;
    }
    .brand { font-size: 1.15rem; font-weight: 800; color: var(--primary); letter-spacing: 0.15em; display: flex; align-items: center; gap: 8px; }
    .new-badge {
      background: var(--accent-red); color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 10px; font-weight: bold;
      animation: blink 1.5s infinite; display: none;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .header-btns { display: flex; gap: 6px; align-items: center; }
    .icon-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 14px; font-size: 0.75rem; cursor: pointer; font-weight: bold; }

    /* Main Scroll Area */
    .main-content {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 12px; min-height: 0; padding-right: 2px;
    }

    /* Card Section Base */
    .section-card {
      background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 14px; padding: 12px;
      display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .section-title { font-size: 0.92rem; font-weight: bold; color: var(--primary); display: flex; justify-content: space-between; align-items: center; }

    /* Canvas Drawing Area */
    .canvas-wrapper {
      position: relative; background: #05070c; border-radius: 10px; border: 1px solid var(--border);
      overflow: hidden; height: 180px; display: flex; justify-content: center; align-items: center;
    }
    canvas { touch-action: none; cursor: crosshair; width: 100%; height: 100%; }

    .canvas-tools { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
    .btn-action {
      background: #222d45; color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; font-weight: bold; font-size: 0.82rem; cursor: pointer;
    }
    .btn-action.primary { background: var(--primary); color: #05070c; border: none; }

    /* BBS Post Cards */
    .post-card {
      background: #0d1322; border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px;
    }
    .post-header { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--sub-text); }
    .post-body { background: #05070c; border-radius: 8px; padding: 6px; overflow: hidden; }
    
    .reaction-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
    .react-btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; padding: 2px 8px; font-size: 0.75rem; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 4px;
    }

    .replies-container { margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
    .reply-item { background: #151c2c; padding: 6px 8px; border-radius: 6px; font-size: 0.8rem; }

    /* Modals (Archive / Calendar Event / Reply) */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 10000;
      justify-content: center; align-items: center; padding: 15px;
    }
    .modal-card {
      background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 16px; width: 100%; max-width: 500px;
      max-height: 85vh; display: flex; flex-direction: column; padding: 16px; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal-header { font-weight: bold; font-size: 1rem; color: var(--primary); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

    /* Calendar Base */
    .calendar-section { height: 210px; flex-shrink: 0; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 0.75rem; flex: 1; }
    .cal-head { font-weight: bold; color: var(--sub-text); padding: 2px 0; }
    .cal-cell {
      background: #0b0f19; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding: 2px; font-weight: bold; color: #d1d5db; cursor: pointer; user-select: none; min-height: 26px;
    }
    .cal-cell.today { background: rgba(16, 185, 129, 0.2); color: var(--primary); border: 1px solid var(--primary); }
    .event-dot { width: 4px; height: 4px; background: var(--primary); border-radius: 50%; margin-top: 2px; }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash">
    <div class="splash-icon">✍️</div>
    <div class="splash-logo">CANVAS</div>
    <div class="splash-sub">Handwriting & Message</div>
  </div>

  <div class="app-container">
    <header>
      <div class="brand">
        VIL CANVAS <span class="new-badge" id="globalNewBadge">NEW</span>
      </div>
      <div class="header-btns">
        <button class="icon-btn" onclick="requestNotificationPermission()">🔔 通知ON</button>
        <button class="icon-btn" onclick="openArchiveModal()">📜 過去ログ</button>
      </div>
    </header>

    <div class="main-content">
      <!-- 1. 新規手書き作成カード -->
      <section class="section-card">
        <div class="section-title">
          <span>✍️ メッセージを書く</span>
          <input type="text" id="authorName" placeholder="名前 (任意)" style="background:#05070c; border:1px solid var(--border); color:white; padding:2px 8px; border-radius:6px; font-size:0.75rem; width:100px;">
        </div>
        <div class="canvas-wrapper" id="mainCanvasContainer">
          <canvas id="mainCanvas"></canvas>
        </div>
        <div class="canvas-tools">
          <button class="btn-action" onclick="clearMainCanvas()">クリア</button>
          <button class="btn-action" onclick="replayMainCanvas()">▶ プレビュー</button>
          <button class="btn-action primary" onclick="submitMainPost()">投稿する (送信)</button>
        </div>
      </section>

      <!-- 2. タイムライン (直近10件) -->
      <section class="section-card">
        <div class="section-title">
          <span>💬 手書き掲示板タイムライン</span>
          <span style="font-size:0.75rem; color:var(--sub-text);" id="postCountLabel">直近10件を表示</span>
        </div>
        <div id="timelineContainer" style="display:flex; flex-direction:column; gap:10px;"></div>
      </section>

      <!-- 3. カレンダー -->
      <section class="section-card calendar-section">
        <div class="section-title">
          <span id="calMonth">----年--月</span>
          <button class="icon-btn" onclick="openAddEventModal()">＋ 予定追加</button>
        </div>
        <div class="cal-grid" id="calHeader">
          <div class="cal-head" style="color:#ef4444;">日</div><div class="cal-head">月</div><div class="cal-head">火</div>
          <div class="cal-head">水</div><div class="cal-head">木</div><div class="cal-head">金</div><div class="cal-head" style="color:#3b82f6;">土</div>
        </div>
        <div class="cal-grid" id="calBody"></div>
      </section>
    </div>
  </div>

  <!-- モーダル1: 過去ログ (11件目以降) -->
  <div class="modal-overlay" id="archiveModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>📜 過去の投稿一覧</span>
        <button class="icon-btn" onclick="closeModal('archiveModal')">✕ 閉じる</button>
      </div>
      <div class="modal-body" id="archiveContainer"></div>
    </div>
  </div>

  <!-- モーダル2: 予定追加 / 削除 -->
  <div class="modal-overlay" id="eventModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>📅 予定の管理</span>
        <button class="icon-btn" onclick="closeModal('eventModal')">✕ 閉じる</button>
      </div>
      <div class="modal-body">
        <form id="eventForm" onsubmit="saveEvent(event)" style="display:flex; flex-direction:column; gap:8px;">
          <input type="date" id="evtDate" required style="background:#05070c; border:1px solid var(--border); color:white; padding:8px; border-radius:6px;">
          <input type="text" id="evtTitle" placeholder="予定を入力してください" required style="background:#05070c; border:1px solid var(--border); color:white; padding:8px; border-radius:6px;">
          <button type="submit" class="btn-action primary" style="width:100%;">予定を保存</button>
        </form>
        <hr style="border:none; border-top:1px solid var(--border); margin:6px 0;">
        <div style="font-weight:bold; font-size:0.85rem; color:var(--sub-text);">登録済み予定一覧:</div>
        <div id="eventListContainer" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>
    </div>
  </div>

  <!-- モーダル3: 手書き返信モーダル -->
  <div class="modal-overlay" id="replyDrawModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>✍️ 手書きで返信</span>
        <button class="icon-btn" onclick="closeModal('replyDrawModal')">✕ 閉じる</button>
      </div>
      <div class="modal-body">
        <div class="canvas-wrapper" style="height:150px;">
          <canvas id="replyCanvas"></canvas>
        </div>
        <div class="canvas-tools">
          <button class="btn-action" onclick="clearReplyCanvas()">クリア</button>
          <button class="btn-action primary" onclick="submitReplyDraw()">返信を送信</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzzX3-your-gas-url/exec";

    // スプラッシュ消去
    setTimeout(() => {
      const splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(() => { splash.style.display = 'none'; }, 600);
      }
    }, 2200);

    let posts = JSON.parse(localStorage.getItem('VIL_CANVAS_POSTS_V3')) || [];
    let events = JSON.parse(localStorage.getItem('VIL_CANVAS_EVENTS')) || [];
    let activeReplyPostId = null;

    // メインキャンバス用
    let mainCanvas, mainCtx, isDrawing = false, currentStroke = [], mainHistory = [], startTime = 0;
    // 返信キャンバス用
    let replyCanvas, replyCtx, isReplyDrawing = false, currentReplyStroke = [], replyHistory = [], replyStartTime = 0;

    window.onload = function() {
      initMainCanvas();
      renderTimeline();
      renderCalendar();
      setInterval(autoSyncData, 4000); // 4秒自動同期
    };

    /* --- メインキャンバス処理 --- */
    function initMainCanvas() {
      const container = document.getElementById('mainCanvasContainer');
      mainCanvas = document.getElementById('mainCanvas');
      mainCanvas.width = container.clientWidth;
      mainCanvas.height = container.clientHeight;

      mainCtx = mainCanvas.getContext('2d');
      mainCtx.lineWidth = 3.5;
      mainCtx.lineCap = 'round';
      mainCtx.strokeStyle = '#10b981';

      function getPos(e) {
        const rect = mainCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function startDraw(e) {
        isDrawing = true;
        if (mainHistory.length === 0) startTime = Date.now();
        const pos = getPos(e);
        mainCtx.beginPath();
        mainCtx.moveTo(pos.x, pos.y);
        currentStroke = [{ type: 'start', x: pos.x, y: pos.y, t: Date.now() - startTime }];
      }

      function moveDraw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        mainCtx.lineTo(pos.x, pos.y);
        mainCtx.stroke();
        currentStroke.push({ type: 'move', x: pos.x, y: pos.y, t: Date.now() - startTime });
      }

      function endDraw() {
        if (isDrawing) {
          isDrawing = false;
          mainHistory.push(currentStroke);
        }
      }

      mainCanvas.addEventListener('mousedown', startDraw);
      mainCanvas.addEventListener('mousemove', moveDraw);
      mainCanvas.addEventListener('mouseup', endDraw);
      mainCanvas.addEventListener('touchstart', startDraw);
      mainCanvas.addEventListener('touchmove', moveDraw);
      mainCanvas.addEventListener('touchend', endDraw);
    }

    function clearMainCanvas() {
      mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
      mainHistory = [];
    }

    function replayMainCanvas() {
      if (mainHistory.length === 0) return;
      playStrokeAnimation('mainCanvas', mainHistory);
    }

    function submitMainPost() {
      if (mainHistory.length === 0) {
        alert('メッセージを描いてください。'); return;
      }
      const author = document.getElementById('authorName').value || '名無し';
      const newPost = {
        id: 'P_' + Date.now(),
        author: author,
        time: new Date().toLocaleString('ja-JP'),
        strokes: mainHistory,
        reactions: { '👍': 0, '👌': 0, '🙏': 0 },
        replies: []
      };

      posts.unshift(newPost);
      saveLocalPosts();
      clearMainCanvas();
      renderTimeline();
      sendPushNotification("新着手書き投稿", `${author}さんからメッセージが届きました！`);
    }

    /* --- アニメーション再生エンジン --- */
    function playStrokeAnimation(canvasId, strokeHistory) {
      const cvs = document.getElementById(canvasId);
      if (!cvs) return;
      const c = cvs.getContext('2d');
      c.clearRect(0, 0, cvs.width, cvs.height);
      c.lineWidth = 3.5; c.lineCap = 'round'; c.strokeStyle = '#10b981';

      let allPoints = [];
      strokeHistory.forEach(s => { allPoints = allPoints.concat(s); });
      if (allPoints.length === 0) return;

      let idx = 0;
      const startT = Date.now();

      function step() {
        const elapsed = Date.now() - startT;
        while (idx < allPoints.length && allPoints[idx].t <= elapsed) {
          const pt = allPoints[idx];
          if (pt.type === 'start') { c.beginPath(); c.moveTo(pt.x, pt.y); }
          else if (pt.type === 'move') { c.lineTo(pt.x, pt.y); c.stroke(); }
          idx++;
        }
        if (idx < allPoints.length) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    /* --- タイムライン描画 (直近10件) --- */
    function renderTimeline() {
      const container = document.getElementById('timelineContainer');
      const recentPosts = posts.slice(0, 10);

      if (recentPosts.length === 0) {
        container.innerHTML = '<p style="color:var(--sub-text); font-size:0.8rem;">まだ投稿がありません。</p>';
        return;
      }

      container.innerHTML = recentPosts.map((post, idx) => {
        const canvasId = 'postCvs_' + post.id;
        let repliesHtml = (post.replies || []).map(r => {
          if (r.strokes) {
            const rCvsId = 'replyCvs_' + r.id;
            setTimeout(() => playStrokeAnimation(rCvsId, r.strokes), 100);
            return `<div class="reply-item">
              <div style="font-size:0.7rem; color:var(--sub-text);">${r.author} • ${r.time}</div>
              <canvas id="${rCvsId}" width="200" height="80" style="background:#05070c; border-radius:4px;"></canvas>
            </div>`;
          } else {
            return `<div class="reply-item"><strong>${r.author}:</strong> ${r.text} <span style="font-size:0.65rem; color:var(--sub-text);">${r.time}</span></div>`;
          }
        }).join('');

        setTimeout(() => playStrokeAnimation(canvasId, post.strokes), 100);

        return `
          <div class="post-card">
            <div class="post-header">
              <strong>${post.author}</strong>
              <span>${post.time}</span>
            </div>
            <div class="post-body">
              <canvas id="${canvasId}" width="260" height="120"></canvas>
            </div>
            <div class="reaction-bar">
              <button class="react-btn" onclick="addReaction('${post.id}', '👍')">👍 ${post.reactions['👍'] || 0}</button>
              <button class="react-btn" onclick="addReaction('${post.id}', '👌')">👌 ${post.reactions['👌'] || 0}</button>
              <button class="react-btn" onclick="addReaction('${post.id}', '🙏')">🙏 ${post.reactions['🙏'] || 0}</button>
              <button class="react-btn" onclick="playStrokeAnimation('${canvasId}', ${JSON.stringify(post.strokes).replace(/"/g, '&quot;')})">▶ 再生</button>
              <button class="react-btn" style="color:var(--primary);" onclick="openReplyModal('${post.id}')">✍️ 返信</button>
            </div>
            ${repliesHtml ? `<div class="replies-container">${repliesHtml}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function addReaction(postId, emoji) {
      const target = posts.find(p => p.id === postId);
      if (target) {
        if (!target.reactions) target.reactions = {};
        target.reactions[emoji] = (target.reactions[emoji] || 0) + 1;
        saveLocalPosts();
        renderTimeline();
      }
    }

    /* --- 手書き返信処理 --- */
    function openReplyModal(postId) {
      activeReplyPostId = postId;
      document.getElementById('replyDrawModal').style.display = 'flex';
      setTimeout(initReplyCanvas, 100);
    }

    function initReplyCanvas() {
      replyCanvas = document.getElementById('replyCanvas');
      replyCanvas.width = replyCanvas.parentElement.clientWidth;
      replyCanvas.height = replyCanvas.parentElement.clientHeight;
      replyCtx = replyCanvas.getContext('2d');
      replyCtx.lineWidth = 3; replyCtx.lineCap = 'round'; replyCtx.strokeStyle = '#10b981';

      function getPos(e) {
        const rect = replyCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function start(e) {
        isReplyDrawing = true;
        if (replyHistory.length === 0) replyStartTime = Date.now();
        const pos = getPos(e);
        replyCtx.beginPath(); replyCtx.moveTo(pos.x, pos.y);
        currentReplyStroke = [{ type: 'start', x: pos.x, y: pos.y, t: Date.now() - replyStartTime }];
      }

      function move(e) {
        if (!isReplyDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        replyCtx.lineTo(pos.x, pos.y); replyCtx.stroke();
        currentReplyStroke.push({ type: 'move', x: pos.x, y: pos.y, t: Date.now() - replyStartTime });
      }

      function end() {
        if (isReplyDrawing) { isReplyDrawing = false; replyHistory.push(currentReplyStroke); }
      }

      replyCanvas.addEventListener('mousedown', start); replyCanvas.addEventListener('mousemove', move); replyCanvas.addEventListener('mouseup', end);
      replyCanvas.addEventListener('touchstart', start); replyCanvas.addEventListener('touchmove', move); replyCanvas.addEventListener('touchend', end);
    }

    function clearReplyCanvas() {
      if (replyCtx) replyCtx.clearRect(0, 0, replyCanvas.width, replyCanvas.height);
      replyHistory = [];
    }

    function submitReplyDraw() {
      if (replyHistory.length === 0) return;
      const target = posts.find(p => p.id === activeReplyPostId);
      if (target) {
        if (!target.replies) target.replies = [];
        const author = document.getElementById('authorName').value || '名無し';
        target.replies.push({
          id: 'R_' + Date.now(),
          author: author,
          time: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
          strokes: replyHistory
        });
        saveLocalPosts();
        closeModal('replyDrawModal');
        clearReplyCanvas();
        renderTimeline();
      }
    }

    /* --- 過去アーカイブ表示 (11件目〜) --- */
    function openArchiveModal() {
      document.getElementById('archiveModal').style.display = 'flex';
      const container = document.getElementById('archiveContainer');
      const archivePosts = posts.slice(10);

      if (archivePosts.length === 0) {
        container.innerHTML = '<p style="color:var(--sub-text); font-size:0.8rem;">11件目以降の過去投稿はまだありません。</p>';
        return;
      }

      container.innerHTML = archivePosts.map((post) => {
        const canvasId = 'archCvs_' + post.id;
        setTimeout(() => playStrokeAnimation(canvasId, post.strokes), 100);
        return `
          <div class="post-card">
            <div class="post-header"><strong>${post.author}</strong><span>${post.time}</span></div>
            <div class="post-body"><canvas id="${canvasId}" width="260" height="120"></canvas></div>
          </div>
        `;
      }).join('');
    }

    /* --- カレンダー & 予定追加・削除 --- */
    function renderCalendar() {
      const now = new Date();
      const year = now.getFullYear(); const month = now.getMonth();
      document.getElementById('calMonth').innerText = `${year}年 ${month + 1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const body = document.getElementById('calBody');
      body.innerHTML = '';

      for (let i = 0; i < firstDay; i++) { body.appendChild(document.createElement('div')); }

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        if (day === now.getDate()) cell.classList.add('today');
        cell.innerText = day;

        const hasEv = events.some(e => e.date === dateStr);
        if (hasEv) {
          const dot = document.createElement('div'); dot.className = 'event-dot'; cell.appendChild(dot);
        }

        cell.onclick = () => {
          document.getElementById('evtDate').value = dateStr;
          openAddEventModal();
        };
        body.appendChild(cell);
      }
    }

    function openAddEventModal() {
      document.getElementById('eventModal').style.display = 'flex';
      renderEventList();
    }

    function saveEvent(e) {
      e.preventDefault();
      const date = document.getElementById('evtDate').value;
      const title = document.getElementById('evtTitle').value;
      events.push({ id: 'E_' + Date.now(), date: date, title: title });
      localStorage.setItem('VIL_CANVAS_EVENTS', JSON.stringify(events));
      document.getElementById('evtTitle').value = '';
      renderEventList();
      renderCalendar();
    }

    function deleteEvent(eventId) {
      events = events.filter(e => e.id !== eventId);
      localStorage.setItem('VIL_CANVAS_EVENTS', JSON.stringify(events));
      renderEventList();
      renderCalendar();
    }

    function renderEventList() {
      const container = document.getElementById('eventListContainer');
      if (events.length === 0) {
        container.innerHTML = '<p style="color:var(--sub-text); font-size:0.75rem;">登録されている予定はありません。</p>';
        return;
      }
      container.innerHTML = events.map(e => `
        <div style="background:#05070c; padding:6px 10px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; font-size:0.8rem;">
          <span><strong>${e.date}</strong>: ${e.title}</span>
          <button class="icon-btn" style="color:var(--accent-red);" onclick="deleteEvent('${e.id}')">削除</button>
        </div>
      `).join('');
    }

    /* --- バックグラウンド同期 ＆ 新着判定 --- */
    function autoSyncData() {
      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ posts: posts, events: events })
      })
      .then(res => res.json())
      .then(res => {
        if (res.posts && JSON.stringify(res.posts) !== JSON.stringify(posts)) {
          posts = res.posts;
          saveLocalPosts();
          renderTimeline();
          document.getElementById('globalNewBadge').style.display = 'inline-block';
          sendPushNotification("新着投稿あり", "手書き掲示板に新しい投稿が届きました！");
        }
      })
      .catch(() => {});
    }

    function saveLocalPosts() {
      localStorage.setItem('VIL_CANVAS_POSTS_V3', JSON.stringify(posts));
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    /* --- 通知機能 (Web Push API) --- */
    function requestNotificationPermission() {
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            alert('通知をオンにしました！新着投稿があるとお知らせします。');
          } else {
            alert('通知がブロックされました。端末の設定をご確認ください。');
          }
        });
      } else {
        alert('お使いのブラウザは通知に対応していません。');
      }
    }

    function sendPushNotification(title, body) {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, { body: body, icon: '✍️' });
      }
    }
  </script>
</body>
</html>
