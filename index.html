<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VIL Canvas</title>
  <style>
    :root {
      --bg: #0b0f19; --card: #151c2c; --primary: #3b82f6; --text: #f9fafb; --sub: #9ca3af; --border: #2a354d; --red: #ef4444; --green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--text); font-family: sans-serif; }
    .app { display: flex; flex-direction: column; height: 100dvh; max-width: 600px; margin: 0 auto; padding: 8px; gap: 8px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 2px; flex-shrink: 0; }
    .brand { font-size: 0.95rem; font-weight: 800; color: var(--primary); display: flex; gap: 4px; align-items: center; }
    .badge { background: var(--red); color: white; font-size: 0.6rem; padding: 2px 5px; border-radius: 8px; display: none; }
    .btns { display: flex; gap: 3px; }
    .ibtn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 4px 7px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; cursor: pointer; }
    .dbtn { background: rgba(16,185,129,0.2); border-color: var(--green); color: var(--green); }
    .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .c-title { font-size: 0.85rem; font-weight: bold; color: var(--primary); display: flex; justify-content: space-between; }
    .c-wrap { position: relative; background: #05070c; border-radius: 8px; border: 1px solid var(--border); height: 160px; width: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    canvas { touch-action: none; cursor: crosshair; width: 100%; height: 100%; position: absolute; inset: 0; z-index: 2; }
    .bg-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; opacity: 0.95; pointer-events: none; }
    .tools { display: flex; gap: 5px; justify-content: space-between; align-items: center; }
    .btn { background: #222d45; color: var(--text); border: 1px solid var(--border); padding: 7px 10px; border-radius: 6px; font-weight: bold; font-size: 0.75rem; cursor: pointer; }
    .btn.active { background: var(--primary); border-color: var(--primary); }
    .sbtn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 900; font-size: 0.85rem; cursor: pointer; margin-left: auto; }
    .note { font-size: 0.65rem; color: var(--sub); margin-top: -4px; }
    .post { background: #0d1322; border: 1px solid var(--border); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .p-head { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--sub); }
    .p-body { background: #05070c; border-radius: 6px; height: 110px; width: 100%; position: relative; overflow: hidden; border: 1px solid rgba(59,130,246,0.2); cursor: pointer; }
    .p-body::after { content: '🔍 拡大'; position: absolute; bottom: 3px; right: 5px; background: rgba(0,0,0,0.6); color: #60a5fa; font-size: 0.6rem; padding: 1px 4px; border-radius: 3px; z-index: 3; }
    .r-bar { display: flex; gap: 4px; align-items: center; }
    .r-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 10px; padding: 2px 6px; font-size: 0.7rem; color: var(--text); cursor: pointer; }
    .del { background: none; border: none; color: var(--red); font-size: 0.65rem; font-weight: bold; cursor: pointer; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; padding: 10px; }
    .m-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 480px; max-height: 90vh; display: flex; flex-direction: column; padding: 14px; gap: 10px; }
    .full-modal { width: 100vw !important; height: 100dvh !important; max-width: none !important; max-height: none !important; border-radius: 0 !important; border: none !important; padding: 8px !important; }
    .m-head { font-weight: bold; font-size: 0.9rem; color: var(--primary); display: flex; justify-content: space-between; align-items: center; }
    .m-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .pin-disp { font-size: 1.8rem; letter-spacing: 0.4em; text-align: center; background: #05070c; padding: 8px; border-radius: 6px; border: 1px solid var(--border); font-family: monospace; }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 250px; margin: 0 auto; }
    .kbtn { background: #222d45; border: 1px solid var(--border); color: white; font-size: 1.2rem; font-weight: bold; padding: 12px; border-radius: 10px; cursor: pointer; text-align: center; }
    .d-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .d-inp { background: #05070c; border: 1px solid var(--border); color: white; padding: 8px; border-radius: 6px; font-size: 0.85rem; width: 100%; }
    .tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
    .tbtn { background: #222d45; border: 1px solid var(--border); color: var(--sub); padding: 5px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .tbtn.active { background: var(--green); color: white; border-color: var(--green); }
    .cal-sec { height: 195px; flex-shrink: 0; }
    .c-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 0.7rem; flex: 1; }
    .c-head { font-weight: bold; color: var(--sub); }
    .c-cell { background: #0b0f19; border-radius: 4px; display: flex; flex-direction: column; align-items: center; padding: 2px; font-weight: bold; color: #d1d5db; cursor: pointer; min-height: 24px; }
    .c-cell.today { background: rgba(59,130,246,0.2); color: var(--primary); border: 1px solid var(--primary); }
    .dot { width: 3px; height: 3px; background: var(--primary); border-radius: 50%; margin-top: 1px; }
  </style>
</head>
<body>

  <div class="app">
    <header>
      <div class="brand">VIL CANVAS <span class="badge" id="gBadge">NEW</span></div>
      <div class="btns">
        <button class="ibtn dbtn" onclick="openPin()">💰 入金</button>
        <button class="ibtn" onclick="openModal('nameModal')">👤 名前</button>
        <button class="ibtn" onclick="openModal('archModal')">📜 ログ</button>
      </div>
    </header>

    <div class="main">
      <section class="card">
        <div class="c-title"><span>✍️ メッセージ・写真</span><span id="authorDisp" style="font-size:0.7rem; color:var(--sub);"></span></div>
        <div class="c-wrap" id="mWrap"><img id="mBg" class="bg-img" style="display:none;"><canvas id="mCvs"></canvas></div>
        <div class="note">ℹ️ 画像は自動で最適化されます。</div>
        <div class="tools">
          <label class="btn" style="cursor:pointer;">📷 画像<input type="file" accept="image/*" style="display:none;" onchange="imgSelect(event)"></label>
          <button class="btn" id="penBtn" onclick="togglePen()">細め</button>
          <button class="btn" id="eraseBtn" onclick="toggleErase()">消しゴム</button>
          <button class="btn" onclick="openFull()">全画面</button>
          <button class="btn" onclick="clearCvs()">クリア</button>
          <button class="sbtn" onclick="submitPost()">投稿</button>
        </div>
      </section>

      <section class="card">
        <div class="c-title"><span>💬 タイムライン</span></div>
        <div id="timeline" style="display:flex; flex-direction:column; gap:8px;"></div>
      </section>

      <section class="card cal-sec">
        <div class="c-title"><span id="calM">----年--月</span><button class="ibtn" onclick="openEvt()">＋ 予定</button></div>
        <div class="c-grid"><div class="c-head" style="color:var(--red);">日</div><div class="c-head">月</div><div class="c-head">火</div><div class="c-head">水</div><div class="c-head">木</div><div class="c-head">金</div><div class="c-head" style="color:var(--primary);">土</div></div>
        <div class="c-grid" id="calB"></div>
      </section>
    </div>
  </div>

  <!-- 拡大表示用 -->
  <div class="modal" id="viewModal" onclick="closeModal('viewModal')">
    <div class="card full-modal" onclick="event.stopPropagation()">
      <div class="m-head"><span id="vTitle">拡大表示</span><button class="ibtn" onclick="closeModal('viewModal')">✕</button></div>
      <div class="c-wrap" id="vWrap" style="flex:1; height:auto;"><img id="vBg" class="bg-img" style="display:none;"><canvas id="vCvs"></canvas></div>
      <div class="tools"><button class="btn" id="vRep">▶ 再生</button><button class="btn" onclick="closeModal('viewModal')">閉じる</button></div>
    </div>
  </div>

  <!-- 全画面入力用 -->
  <div class="modal" id="fullModal">
    <div class="card full-modal">
      <div class="m-head"><span>⛶ 全画面入力</span><button class="ibtn" onclick="closeFull()">✓ 完了</button></div>
      <div class="c-wrap" id="fWrap" style="flex:1; height:auto;"><img id="fBg" class="bg-img" style="display:none;"><canvas id="fCvs"></canvas></div>
      <div class="tools"><button class="btn" onclick="clearFull()">クリア</button><button class="sbtn" onclick="closeFull()">完了して反映</button></div>
    </div>
  </div>

  <!-- PIN認証用 -->
  <div class="modal" id="pinModal">
    <div class="m-card" style="max-width:320px;">
      <div class="m-head"><span style="color:var(--green);">🔒 入金管理 認証</span><button class="ibtn" onclick="closeModal('pinModal')">✕</button></div>
      <div class="pin-disp" id="pinStr">----</div>
      <div class="pad">
        <button class="kbtn" onclick="pKey('1')">1</button><button class="kbtn" onclick="pKey('2')">2</button><button class="kbtn" onclick="pKey('3')">3</button>
        <button class="kbtn" onclick="pKey('4')">4</button><button class="kbtn" onclick="pKey('5')">5</button><button class="kbtn" onclick="pKey('6')">6</button>
        <button class="kbtn" onclick="pKey('7')">7</button><button class="kbtn" onclick="pKey('8')">8</button><button class="kbtn" onclick="pKey('9')">9</button>
        <button class="kbtn" onclick="pKey('C')" style="color:var(--red); font-size:0.9rem;">C</button><button class="kbtn" onclick="pKey('0')">0</button><button class="kbtn" onclick="pKey('OK')" style="color:var(--green); font-size:0.9rem;">OK</button>
      </div>
    </div>
  </div>

  <!-- 入金管理画面用 -->
  <div class="modal" id="depModal">
    <div class="card full-modal">
      <div class="m-head"><span style="color:var(--green);">💰 入金管理 & 担当別ボード</span><button class="ibtn" onclick="closeModal('depModal')">✕</button></div>
      <div class="m-body">
        <div class="card" style="border-color:var(--green); background:#0d1322;">
          <div class="c-title" style="color:var(--green);">＋ 新規入金記録</div>
          <div class="d-grid"><input type="number" id="dAmt" class="d-inp" placeholder="金額 (例: 15000)"><input type="text" id="dCli" class="d-inp" placeholder="顧客名 / 案件名"></div>
          <div class="d-grid"><input type="text" id="dStf" class="d-inp" placeholder="担当者名 (例: 山田)"><label class="d-inp" style="text-align:center; background:#222d45; cursor:pointer;">📷 レシート画像<input type="file" accept="image/*" style="display:none;" onchange="dImgSel(event)"></label></div>
          <div id="dPrevC" style="display:none; height:70px; background:#05070c; border-radius:6px; overflow:hidden;"><img id="dPrev" style="width:100%; height:100%; object-fit:contain;"></div>
          <button class="btn" style="background:var(--green); color:white;" onclick="dSub()">登録する</button>
        </div>
        <div class="tabs" id="dTabs"></div>
        <div id="dTL" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>
    </div>
  </div>

  <!-- 名前変更 -->
  <div class="modal" id="nameModal">
    <div class="m-card" style="max-width:320px;">
      <div class="m-head"><span>名前変更</span><button class="ibtn" onclick="closeModal('nameModal')">✕</button></div>
      <input type="text" id="nInp" class="d-inp" placeholder="名前">
      <button class="btn" style="background:var(--primary); color:white;" onclick="saveName()">保存</button>
    </div>
  </div>

  <!-- 過去ログ -->
  <div class="modal" id="archModal">
    <div class="card full-modal">
      <div class="m-head"><span>過去ログ (8件目以降)</span><button class="ibtn" onclick="closeModal('archModal')">✕</button></div>
      <div class="m-body" id="archC"></div>
    </div>
  </div>

  <!-- 予定追加 -->
  <div class="modal" id="evtModal">
    <div class="m-card" style="max-width:320px;">
      <div class="m-head"><span>予定の管理</span><button class="ibtn" onclick="closeModal('evtModal')">✕</button></div>
      <input type="date" id="eDate" class="d-inp">
      <input type="text" id="eTitle" class="d-inp" placeholder="予定内容">
      <button class="btn" style="background:var(--primary); color:white;" onclick="saveEvt()">保存</button>
      <div id="eList" style="display:flex; flex-direction:column; gap:4px; max-height:150px; overflow-y:auto;"></div>
    </div>
  </div>

  <script>
    const GAS = "https://script.google.com/macros/s/AKfycbzzX3-your-gas-url/exec";
    let posts = JSON.parse(localStorage.getItem('V_POSTS')) || [];
    let deps = JSON.parse(localStorage.getItem('V_DEPS')) || [];
    let events = JSON.parse(localStorage.getItem('V_EVTS')) || [];
    let imgData = null, dImgData = null, pinStrVal = "", curTab = "すべて";
    let mCvs, mCtx, fCvs, fCtx, vCvs, vCtx, isDraw = false, history = [], fHistory = [], startT = 0, lineW = 3.5, isErase = false;

    window.onload = () => {
      updAuthor(); initCvs(); renderTL(); renderCal();
      setInterval(() => fetch(GAS,{method:'POST',body:JSON.stringify({posts,events})}).then(r=>r.json()).then(res=>{
        if(res.posts && res.posts.length !== posts.length){ posts = res.posts; saveP(); renderTL(); document.getElementById('gBadge').style.display='inline-block'; }
      }).catch(()=>{}), 10000);
    };

    function getDevId() {
      let id = localStorage.getItem('V_DID');
      if(!id) { id = Math.random().toString(36).substring(2,7).toUpperCase(); localStorage.setItem('V_DID', id); }
      return id;
    }
    function getCol(s) { let h=0; for(let i=0;i<s.length;i++) h=s.charCodeAt(i)+((h<<5)-h); return `hsl(${Math.abs(h)%360},85%,65%)`; }
    function uName() { return localStorage.getItem('V_NAME') || '名無し'; }
    function updAuthor() { document.getElementById('authorDisp').innerHTML = `<span style="color:${getCol(getDevId())};">${uName()}</span>`; }

    function imgSelect(e) {
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas'); let w=img.width, h=img.height;
          if(w>1024){ h*=1024/w; w=1024; } if(h>1024){ w*=1024/h; h=1024; }
          c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
          imgData = c.toDataURL('image/jpeg',0.8);
          ['mBg','fBg'].forEach(id => { let el=document.getElementById(id); if(el){el.src=imgData; el.style.display='block';} });
        }; img.src = ev.target.result;
      }; r.readAsDataURL(f);
    }

    function initCvs() {
      mCvs = document.getElementById('mCvs'); const wrap = document.getElementById('mWrap');
      mCvs.width = wrap.clientWidth; mCvs.height = wrap.clientHeight; mCtx = mCvs.getContext('2d'); mCtx.lineCap='round';
      
      const drawEvts = (cvs, ctx, histGetter, histSetter) => {
        let drawing = false, stroke = [];
        const pos = e => { const r = cvs.getBoundingClientRect(); const cl = e.touches?e.touches[0].clientX:e.clientX, ct = e.touches?e.touches[0].clientY:e.clientY; return {x:cl-r.left, y:ct-r.top}; };
        cvs.onmousedown = cvs.ontouchstart = e => {
          drawing = true; if(histGetter().length===0) startT=Date.now();
          const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineWidth=lineW; ctx.strokeStyle=isErase?'#05070c':'#3b82f6';
          stroke = [{type:'start', x:p.x, y:p.y, t:Date.now()-startT, erase:isErase, w:lineW}];
        };
        cvs.onmousemove = cvs.ontouchmove = e => {
          if(!drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke();
          stroke.push({type:'move', x:p.x, y:p.y, t:Date.now()-startT});
        };
        cvs.onmouseup = cvs.ontouchend = () => {
          if(drawing){ drawing=false; if(stroke.length>0) histSetter().push(stroke); }
        };
      };
      drawEvts(mCvs, mCtx, ()=>history, ()=>history);
    }

    function togglePen() { isErase=false; document.getElementById('eraseBtn').classList.remove('active'); lineW = lineW===3.5?2.0:3.5; document.getElementById('penBtn').classList.toggle('active', lineW===2.0); }
    function toggleErase() { isErase=!isErase; document.getElementById('eraseBtn').classList.toggle('active', isErase); if(isErase){ document.getElementById('penBtn').classList.remove('active'); lineW=12; }else lineW=3.5; }
    function clearCvs() { mCtx.clearRect(0,0,mCvs.width,mCvs.height); history=[]; imgData=null; ['mBg','fBg'].forEach(id=>{let el=document.getElementById(id);if(el){el.src='';el.style.display='none';}}); }

    function openFull() {
      fHistory = [...history]; document.getElementById('fullModal').style.display = 'flex';
      setTimeout(() => {
        fCvs = document.getElementById('fCvs'); const wrap = document.getElementById('fWrap');
        fCvs.width = wrap.clientWidth; fCvs.height = wrap.clientHeight; fCtx = fCvs.getContext('2d'); fCtx.lineCap='round';
        if(imgData){ let el=document.getElementById('fBg'); el.src=imgData; el.style.display='block'; }
        if(fHistory.length>0) playAnim('fCvs', fHistory);
        //簡易手書き設定
        let drawing=false, stroke=[];
        const pos = e => { const r = fCvs.getBoundingClientRect(); const cl = e.touches?e.touches[0].clientX:e.clientX, ct = e.touches?e.touches[0].clientY:e.clientY; return {x:cl-r.left, y:ct-r.top}; };
        fCvs.onmousedown = fCvs.ontouchstart = e => { drawing=true; const p=pos(e); fCtx.beginPath(); fCtx.moveTo(p.x,p.y); fCtx.lineWidth=lineW; fCtx.strokeStyle=isErase?'#05070c':'#3b82f6'; stroke=[{type:'start',x:p.x,y:p.y,t:Date.now()-startT,erase:isErase,w:lineW}]; };
        fCvs.onmousemove = fCvs.ontouchmove = e => { if(!drawing)return; e.preventDefault(); const p=pos(e); fCtx.lineTo(p.x,p.y); fCtx.stroke(); stroke.push({type:'move',x:p.x,y:p.y,t:Date.now()-startT}); };
        fCvs.onmouseup = fCvs.ontouchend = () => { if(drawing){ drawing=false; if(stroke.length>0) fHistory.push(stroke); } };
      }, 100);
    }
    function clearFull() { fCtx.clearRect(0,0,fCvs.width,fCvs.height); fHistory=[]; }
    function closeFull() {
      history = [...fHistory]; document.getElementById('fullModal').style.display='none';
      mCtx.clearRect(0,0,mCvs.width,mCvs.height); if(history.length>0) playAnim('mCvs', history);
    }

    function submitPost() {
      if(history.length===0 && !imgData){ alert('入力してください'); return; }
      const now = new Date();
      posts.unshift({
        id: 'P_'+Date.now(), ts: now.getTime(), author: uName(), uid: getDevId(),
        time: `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
        strokes: history, image: imgData, replies: []
      });
      saveP(); clearCvs(); renderTL();
    }

    function playAnim(cvsId, hist, col='#3b82f6') {
      const cvs = document.getElementById(cvsId); if(!cvs) return; const c = cvs.getContext('2d');
      c.clearRect(0,0,cvs.width,cvs.height); c.lineCap='round';
      let pts = []; hist.forEach(s => pts=pts.concat(s)); if(pts.length===0) return;
      let idx=0, st=Date.now();
      function step() {
        let el = Date.now()-st;
        while(idx<pts.length && pts[idx].t<=el){
          let p=pts[idx];
          if(p.type==='start'){ c.beginPath(); c.moveTo(p.x,p.y); c.lineWidth=p.w||3.5; c.strokeStyle=p.erase?'#05070c':col; }
          else if(p.type==='move'){ c.lineTo(p.x,p.y); c.stroke(); }
          idx++;
        }
        if(idx<pts.length) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function timeAgo(ts) {
      if(!ts) return ''; const m = Math.floor((Date.now()-ts)/60000);
      if(m<1) return 'たった今'; if(m<60) return `${m}分前`;
      const h = Math.floor(m/60); if(h<24) return `${h}時間前`;
      return `${Math.floor(h/24)}日前`;
    }

    function renderTL() {
      const c = document.getElementById('timeline'); const r = posts.slice(0,7);
      if(r.length===0){ c.innerHTML='<p style="color:var(--sub); font-size:0.75rem;">投稿はありません</p>'; return; }
      c.innerHTML = r.map(p => {
        const cid = 'cvs_'+p.id; setTimeout(()=>playAnim(cid, p.strokes), 50);
        const my = p.uid === getDevId();
        return `<div class="post">
          <div class="p-head">
            <span style="font-weight:bold; color:${col=getCol(p.uid)};">${p.author}</span>
            <div><span style="color:var(--primary); font-weight:bold;">${timeAgo(p.ts)}</span> (${p.time}) ${my?`<button class="del" onclick="delP('${p.id}')">削除</button>`:''}</div>
          </div>
          <div class="p-body" onclick="openView('${p.id}')">
            ${p.image?`<img src="${p.image}" class="bg-img">`:''}<canvas id="${cid}"></canvas>
          </div>
        </div>`;
      }).join('');
    }

    function openView(id) {
      const p = posts.find(x => x.id===id); if(!p) return;
      document.getElementById('vTitle').innerText = `${p.author} さんの投稿`;
      document.getElementById('viewModal').style.display = 'flex';
      setTimeout(()=>{
        vCvs = document.getElementById('vCvs'); const w = document.getElementById('vWrap');
        vCvs.width=w.clientWidth; vCvs.height=w.clientHeight;
        let bg=document.getElementById('vBg'); if(p.image){bg.src=p.image;bg.style.display='block';}else{bg.style.display='none';}
        playAnim('vCvs', p.strokes);
        document.getElementById('vRep').onclick = () => playAnim('vCvs', p.strokes);
      },50);
    }

    function delP(id) { if(confirm('削除しますか？')){ posts=posts.filter(x=>x.id!==id); saveP(); renderTL(); } }

    /* PIN & Deposit */
    function openPin() { pinStrVal=""; updPin(); document.getElementById('pinModal').style.display='flex'; }
    function pKey(k) {
      if(k==='C') pinStrVal=""; else if(k==='OK'){
        if(pinStrVal==='1225'){ closeModal('pinModal'); openDep(); } else { alert('違います'); pinStrVal=""; }
      } else if(pinStrVal.length<4) pinStrVal+=k;
      updPin();
    }
    function updPin() { let s=""; for(let i=0;i<4;i++) s+=i<pinStrVal.length?'●':'-'; document.getElementById('pinStr').innerText=s; }
    function openDep() { document.getElementById('depModal').style.display='flex'; renderDTabs(); renderDTL(); }

    function dImgSel(e) {
      const f=e.target.files[0]; if(!f) return;
      const r=new FileReader(); r.onload=ev=>{
        const img=new Image(); img.onload=()=>{
          const c=document.createElement('canvas'); let w=img.width, h=img.height;
          if(w>800){h*=800/w;w=800;} c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
          dImgData=c.toDataURL('image/jpeg',0.8);
          document.getElementById('dPrev').src=dImgData; document.getElementById('dPrevC').style.display='block';
        }; img.src=ev.target.result;
      }; r.readAsDataURL(f);
    }

    function dSub() {
      const amt=document.getElementById('dAmt').value, cli=document.getElementById('dCli').value, stf=document.getElementById('dStf').value||'未割当';
      if(!amt||!cli){alert('金額と顧客名を入力');return;}
      const now=new Date();
      deps.unshift({ id:'D_'+Date.now(), amt:Number(amt).toLocaleString()+'円', cli, stf, author:uName(), uid:getDevId(), time:`${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`, img:dImgData });
      localStorage.setItem('V_DEPS', JSON.stringify(deps));
      document.getElementById('dAmt').value=''; document.getElementById('dCli').value=''; document.getElementById('dStf').value=''; dImgData=null; document.getElementById('dPrevC').style.display='none';
      renderDTabs(); renderDTL();
    }

    function renderDTabs() {
      const staffs = ['すべて', ...new Set(deps.map(d=>d.stf))];
      document.getElementById('dTabs').innerHTML = staffs.map(s => `<button class="tbtn ${curTab===s?'active':''}" onclick="curTab='${s}';renderDTabs();renderDTL();">${s}</button>`).join('');
    }

    function renderDTL() {
      const f = curTab==='すべて'?deps:deps.filter(d=>d.stf===curTab);
      document.getElementById('dTL').innerHTML = f.length===0?'<p style="color:var(--sub);font-size:0.75rem;">データなし</p>':f.map(d=>`
        <div class="post" style="border-color:var(--green);">
          <div class="p-head"><span style="color:var(--green); font-weight:bold;">💰 ${d.amt} (${d.time})</span> ${d.uid===getDevId()?`<button class="del" onclick="delD('${d.id}')">削除</button>`:''}</div>
          <div style="font-size:0.75rem;">顧客: ${d.cli} / 担当: <strong style="color:var(--primary);">${d.stf}</strong></div>
          ${d.img?`<div style="height:90px;background:#05070c;border-radius:4px;overflow:hidden;"><img src="${d.img}" style="width:100%;height:100%;object-fit:contain;"></div>`:''}
        </div>`).join('');
    }
    function delD(id) { if(confirm('削除しますか？')){ deps=deps.filter(x=>x.id!==id); localStorage.setItem('V_DEPS', JSON.stringify(deps)); renderDTabs(); renderDTL(); } }

    /* Calendar */
    function renderCal() {
      const now = new Date(), y=now.getFullYear(), m=now.getMonth();
      document.getElementById('calM').innerText = `${y}年 ${m+1}月`;
      const fd = new Date(y,m,1).getDay(), days = new Date(y,m+1,0).getDate();
      let b = ''; for(let i=0;i<fd;i++) b+='<div></div>';
      let todayStr = `${y}-${String(m+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`, hasEv=false;
      for(let d=1;d<=days;d++){
        let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        let ev=events.some(e=>e.date===ds); if(ev && ds===todayStr) hasEv=true;
        b+=`<div class="c-cell ${d===now.getDate()?'today':''}" onclick="document.getElementById('eDate').value='${ds}';openEvt();">${d}${ev?'<div class="dot"></div>':''}</div>`;
      }
      document.getElementById('calB').innerHTML=b;
      document.getElementById('gBadge').style.display = hasEv?'inline-block':'none';
    }
    function openEvt() { document.getElementById('evtModal').style.display='flex'; renderEvtList(); }
    function saveEvt(e) {
      const dt=document.getElementById('eDate').value, tl=document.getElementById('eTitle').value;
      if(!dt||!tl) return; events.push({id:'E_'+Date.now(), date:dt, title:tl});
      localStorage.setItem('V_EVTS', JSON.stringify(events)); document.getElementById('eTitle').value=''; renderEvtList(); renderCal();
    }
    function renderEvtList() {
      document.getElementById('eList').innerHTML = events.map(e=>`<div style="background:#05070c;padding:4px;border-radius:4px;font-size:0.7rem;display:flex;justify-content:space-between;"><span>${e.date}: ${e.title}</span><button class="del" onclick="events=events.filter(x=>x.id!=='${e.id}');localStorage.setItem('V_EVTS',JSON.stringify(events));renderEvtList();renderCal();">削除</button></div>`).join('');
    }

    function saveName() { let n=document.getElementById('nInp').value.trim(); if(n){ localStorage.setItem('V_NAME', n); updAuthor(); closeModal('nameModal'); } }
    function saveP() { localStorage.setItem('V_POSTS', JSON.stringify(posts)); }
    function closeModal(id) { document.getElementById(id).style.display='none'; }
    function openModal(id) { document.getElementById(id).style.display='flex'; }
  </script>
</body>
</html>
