<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VIL Canvas - Handwriting Note</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --primary: #3b82f6;
      --primary-light: rgba(59, 130, 246, 0.15);
      --text: #f9fafb;
      --sub-text: #9ca3af;
      --border: #2a354d;
      --accent-red: #ef4444;
      --reply-blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Splash Screen */
    #splash {
      position: fixed; inset: 0;
      background: radial-gradient(circle at center, #1a263d 0%, #080b12 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999; transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #splash.fade-out { opacity: 0; pointer-events: none; }
    .splash-icon { font-size: 3rem; margin-bottom: 10px; filter: drop-shadow(0 0 12px rgba(59, 130, 246, 0.4)); }
    .splash-logo {
      font-size: 2.8rem; font-weight: 900; letter-spacing: 0.25em;
      background: linear-gradient(135deg, #ffffff 0%, var(--primary) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px;
    }
    .splash-sub { font-size: 0.8rem; color: var(--sub-text); letter-spacing: 0.3em; font-weight: 600; text-transform: uppercase; }

    /* App Container */
    .app-container {
      display: flex; flex-direction: column; height: 100dvh; max-width: 600px; margin: 0 auto; padding: 10px; gap: 10px;
    }

    header {
      display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; flex-shrink: 0;
    }
    .brand { font-size: 1.1rem; font-weight: 800; color: var(--primary); letter-spacing: 0.12em; display: flex; align-items: center; gap: 6px; }
    .new-badge {
      background: var(--accent-red); color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 10px; font-weight: bold;
      animation: blink 1.5s infinite; display: none;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .header-btns { display: flex; gap: 4px; align-items: center; }
    .icon-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 5px 8px; border-radius: 12px; font-size: 0.72rem; cursor: pointer; font-weight: bold; }

    .main-content {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 12px; min-height: 0; padding-right: 2px;
    }

    .section-card {
      background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 14px; padding: 12px;
      display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .section-title { font-size: 0.92rem; font-weight: bold; color: var(--primary); display: flex; justify-content: space-between; align-items: center; }

    /* Canvas Wrapper */
    .canvas-wrapper {
      position: relative; background: #05070c; border-radius: 10px; border: 1px solid var(--border);
      overflow: hidden; height: 180px; width: 100%; display: flex; justify-content: center; align-items: center;
    }
    canvas { touch-action: none; cursor: crosshair; width: 100%; height: 100%; position: absolute; inset: 0; z-index: 2; }
    .bg-image-preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; opacity: 0.9; pointer-events: none; }

    /* Tools */
    .canvas-tools { display: flex; gap: 6px; justify-content: space-between; align-items: center; flex-wrap: nowrap; }
    .btn-action {
      background: #222d45; color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 0.8rem; cursor: pointer;
    }
    .btn-submit-lg {
      background: var(--primary); color: #ffffff; border: none; padding: 10px 20px; border-radius: 10px;
      font-weight: 900; font-size: 0.95rem; cursor: pointer; box-shadow: 0 3px 10px rgba(59, 130, 246, 0.3); margin-left: auto;
    }
    .btn-submit-lg:active { transform: scale(0.97); }

    /* BBS Cards (ブルー基調) */
    .post-card {
      background: #0d1322; border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px;
    }
    .post-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--sub-text); }
    .author-tag { font-weight: bold; font-size: 0.85rem; }
    .user-id-badge { font-size: 0.7rem; opacity: 0.85; margin-left: 3px; font-weight: normal; font-family: monospace; }
    
    .post-body { background: #05070c; border-radius: 8px; padding: 0; overflow: hidden; position: relative; height: 130px; width: 100%; cursor: pointer; border: 1px solid rgba(59, 130, 246, 0.2); }
    .post-body::after {
      content: '🔍 タップで拡大'; position: absolute; bottom: 4px; right: 6px; background: rgba(0,0,0,0.6); color: #60a5fa; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; pointer-events: none; z-index: 3;
    }

    .reaction-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
    .react-btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; padding: 2px 8px; font-size: 0.75rem; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 4px;
    }

    /* Comments */
    .toggle-reply-btn {
      background: none; border: none; color: var(--reply-blue); font-size: 0.75rem; font-weight: bold; cursor: pointer; margin-top: 4px; text-align: left; display: flex; align-items: center; gap: 4px;
    }
    .replies-container {
      display: none; margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--reply-blue); flex-direction: column; gap: 6px;
    }
    .replies-container.open { display: flex; }
    .reply-item { background: #151c2c; padding: 6px 8px; border-radius: 6px; font-size: 0.8rem; border: 1px solid rgba(59, 130, 246, 0.3); color: var(--reply-blue); word-break: break-all; }
    .reply-header { display: flex; justify-content: space-between; align-items: center; }
    .reply-text-content { color: #60a5fa; margin-top: 2px; }

    .del-btn-sm {
      background: none; border: none; color: var(--accent-red); font-size: 0.7rem; font-weight: bold; cursor: pointer; opacity: 0.8; padding: 2px 4px;
    }
    .del-btn-sm:hover { opacity: 1; text-decoration: underline; }

    /* Modals */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000;
      justify-content: center; align-items: center; padding: 15px;
    }
    .modal-card {
      background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 16px; width: 100%; max-width: 500px;
      max-height: 85vh; display: flex; flex-direction: column; padding: 16px; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal-header { font-weight: bold; font-size: 1rem; color: var(--primary); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

    /* 全画面モーダル各種 */
    #fullscreenDrawModal .modal-card,
    #viewPostModal .modal-card {
      width: 100vw; height: 100dvh; max-width: 100vw; max-height: 100dvh; border-radius: 0; border: none; padding: 12px;
    }
    #fullscreenCanvasContainer, #viewPostCanvasContainer { flex: 1; height: 100%; width: 100%; }

    /* Calendar Base */
    .calendar-section { height: 210px; flex-shrink: 0; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 0.75rem; flex: 1; }
    .cal-head { font-weight: bold; color: var(--sub-text); padding: 2px 0; }
    .cal-cell {
      background: #0b0f19; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding: 2px; font-weight: bold; color: #d1d5db; cursor: pointer; user-select: none; min-height: 26px;
    }
    .cal-cell.today { background: rgba(59, 130, 246, 0.2); color: var(--primary); border: 1px solid var(--primary); }
    .event-dot { width: 4px; height: 4px; background: var(--primary); border-radius: 50%; margin-top: 2px; }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash">
    <div class="splash-icon">✍️</div>
    <div class="splash-logo">CANVAS</div>
    <div class="splash-sub">Handwriting & Photo Note</div>
  </div>

  <div class="app-container">
    <header>
      <div class="brand">
        VIL CANVAS <span class="new-badge" id="globalNewBadge">NEW</span>
      </div>
      <div class="header-btns">
        <button class="icon-btn" onclick="openNameModal()">👤 名前変更</button>
        <button class="icon-btn" onclick="requestNotificationPermission()">🔔 通知</button>
        <button class="icon-btn" onclick="openArchiveModal()">📜 過去ログ</button>
      </div>
    </header>

    <div class="main-content">
      <!-- 1. 新規手書き作成カード -->
      <section class="section-card">
        <div class="section-title">
          <span>✍️ メッセージ・写真メモ</span>
          <span id="currentAuthorDisplay" style="font-size:0.75rem; color:var(--sub-text);"></span>
        </div>
        <div class="canvas-wrapper" id="mainCanvasContainer">
          <img id="mainBgImage" class="bg-image-preview" style="display:none;">
          <canvas id="mainCanvas"></canvas>
        </div>
        <div class="canvas-tools">
          <label class="btn-action" style="cursor:pointer;">
            📷 画像
            <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">
          </label>
          <button class="btn-action" onclick="openFullscreenDraw()">⛶ 全画面入力</button>
          <button class="btn-action" onclick="clearMainCanvas()">クリア</button>
          <button class="btn-action" onclick="replayMainCanvas()">▶ プレビュー</button>
          <button class="btn-submit-lg" onclick="submitMainPost()">投稿（送信）</button>
        </div>
      </section>

      <!-- 2. タイムライン -->
      <section class="section-card">
        <div class="section-title">
          <span>💬 掲示板タイムライン</span>
          <span style="font-size:0.75rem; color:var(--sub-text);" id="postCountLabel">最新7件を表示中</span>
        </div>
        <div id="timelineContainer" style="display:flex; flex-direction:column; gap:10px;"></div>
      </section>

      <!-- 3. カレンダー -->
      <section class="section-card calendar-section">
        <div class="section-title">
          <span id="calMonth">----年--月</span>
          <button class="icon-btn" onclick="openAddEventModal()">＋ 予定追加</button>
        </div>
        <div class="cal-grid" id="calHeader">
          <div class="cal-head" style="color:#ef4444;">日</div><div class="cal-head">月</div><div class="cal-head">火</div>
          <div class="cal-head">水</div><div class="cal-head">木</div><div class="cal-head">金</div><div class="cal-head" style="color:#3b82f6;">土</div>
        </div>
        <div class="cal-grid" id="calBody"></div>
      </section>
    </div>
  </div>

  <!-- モーダル0: 投稿フル画面閲覧モーダル -->
  <div class="modal-overlay" id="viewPostModal">
    <div class="modal-card">
      <div class="modal-header">
        <span id="viewPostHeaderTitle">🔍 投稿の拡大表示</span>
        <button class="icon-btn" onclick="closeModal('viewPostModal')">✕ 閉じる</button>
      </div>
      <div class="modal-body" style="padding:0;">
        <div class="canvas-wrapper" id="viewPostCanvasContainer">
          <img id="viewPostBgImage" class="bg-image-preview" style="display:none;">
          <canvas id="viewPostCanvas"></canvas>
        </div>
      </div>
      <div class="canvas-tools" style="padding-top:8px;">
        <button class="btn-action" id="viewPostReplayBtn">▶ 再生</button>
        <button class="btn-action" style="margin-left:auto;" onclick="closeModal('viewPostModal')">閉じる</button>
      </div>
    </div>
  </div>

  <!-- モーダル1: 大画面入力モーダル -->
  <div class="modal-overlay" id="fullscreenDrawModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>⛶ 大画面手書き入力</span>
        <button class="icon-btn" onclick="closeFullscreenDraw()">✓ 完了して戻る</button>
      </div>
      <div class="modal-body" style="padding:0;">
        <div class="canvas-wrapper" id="fullscreenCanvasContainer">
          <img id="fsBgImage" class="bg-image-preview" style="display:none;">
          <canvas id="fsCanvas"></canvas>
        </div>
      </div>
      <div class="canvas-tools" style="padding-top:8px;">
        <button class="btn-action" onclick="clearFsCanvas()">クリア</button>
        <button class="btn-submit-lg" onclick="closeFullscreenDraw()">画面を反映して完了</button>
      </div>
    </div>
  </div>

  <!-- モーダル2: 名前変更 -->
  <div class="modal-overlay" id="nameModal">
    <div class="modal-card" style="max-width:360px;">
      <div class="modal-header">
        <span>👤 ハンドルネーム変更</span>
        <button class="icon-btn" onclick="closeModal('nameModal')">✕ 閉じる</button>
      </div>
      <div class="modal-body">
        <div style="font-size:0.8rem; color:var(--sub-text);">名前を変更すると、過去のあなたの全投稿・コメントの表示名も自動変更されます。</div>
        <input type="text" id="nameInput" placeholder="名前を入力してください" style="background:#05070c; border:1px solid var(--border); color:white; padding:10px; border-radius:8px; font-size:0.9rem;">
        <button class="btn-action primary" onclick="saveNameSetting()" style="width:100%;">一括変更して保存</button>
      </div>
    </div>
  </div>

  <!-- モーダル3: 過去ログ -->
  <div class="modal-overlay" id="archiveModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>📜 過去の投稿一覧 (8件目以前)</span>
        <button class="icon-btn" onclick="closeModal('archiveModal')">✕ 閉じる</button>
      </div>
      <div class="modal-body" id="archiveContainer"></div>
    </div>
  </div>

  <!-- モーダル4: 予定追加 / 削除 -->
  <div class="modal-overlay" id="eventModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>📅 予定の管理</span>
        <button class="icon-btn" onclick="closeModal('eventModal')">✕ 閉じる</button>
      </div>
      <div class="modal-body">
        <form id="eventForm" onsubmit="saveEvent(event)" style="display:flex; flex-direction:column; gap:8px;">
          <input type="date" id="evtDate" required style="background:#05070c; border:1px solid var(--border); color:white; padding:8px; border-radius:6px;">
          <input type="text" id="evtTitle" placeholder="予定を入力してください" required style="background:#05070c; border:1px solid var(--border); color:white; padding:8px; border-radius:6px;">
          <button type="submit" class="btn-action primary" style="width:100%;">予定を保存</button>
        </form>
        <hr style="border:none; border-top:1px solid var(--border); margin:6px 0;">
        <div style="font-weight:bold; font-size:0.85rem; color:var(--sub-text);">登録済み予定一覧:</div>
        <div id="eventListContainer" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>
    </div>
  </div>

  <!-- モーダル5: 返信 -->
  <div class="modal-overlay" id="replyDrawModal">
    <div class="modal-card">
      <div class="modal-header">
        <span style="color:var(--reply-blue);">💬 返信コメント作成</span>
        <button class="icon-btn" onclick="closeModal('replyDrawModal')">✕ 閉じる</button>
      </div>
      <div class="modal-body">
        <div style="display:flex; gap:6px;">
          <input type="text" id="replyTextInput" placeholder="コメントを入力 (文字)" style="flex:1; background:#05070c; border:1px solid var(--reply-blue); color:#60a5fa; padding:8px; border-radius:6px; font-size:0.85rem;">
          <button class="btn-action" style="background:var(--reply-blue); color:white; border:none;" onclick="submitTextReply()">送信</button>
        </div>
        <hr style="border:none; border-top:1px solid var(--border); margin:4px 0;">
        <div style="font-size:0.8rem; color:var(--reply-blue); font-weight:bold;">または手書きで返信 (ブルー描画):</div>
        <div class="canvas-wrapper" id="replyCanvasContainer" style="height:130px; position:relative; border-color:var(--reply-blue);">
          <canvas id="replyCanvas"></canvas>
        </div>
        <div class="canvas-tools">
          <button class="btn-action" onclick="clearReplyCanvas()">クリア</button>
          <button class="btn-action" style="background:var(--reply-blue); color:white; border:none;" onclick="replayReplyCanvas()">▶ プレビュー</button>
          <button class="btn-submit-lg" style="background:var(--reply-blue); color:white; padding:8px 16px; font-size:0.85rem;" onclick="submitReplyDraw()">手書き返信を送信</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzzX3-your-gas-url/exec";

    setTimeout(() => {
      const splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(() => { splash.style.display = 'none'; }, 600);
      }
    }, 2200);

    function getOrCreateDeviceId() {
      let devId = localStorage.getItem('VIL_DEVICE_5ID');
      if (!devId) {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        devId = '';
        for (let i = 0; i < 5; i++) {
          devId += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        localStorage.setItem('VIL_DEVICE_5ID', devId);
      }
      return devId;
    }

    function generateVisibleColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      const hue = Math.abs(hash) % 360;
      return `hsl(${hue}, 85%, 65%)`;
    }

    function getUserName() {
      return localStorage.getItem('VIL_USER_NAME') || '名無し';
    }

    function updateAuthorDisplay() {
      const myId = getOrCreateDeviceId();
      const myName = getUserName();
      const myColor = generateVisibleColor(myId);
      document.getElementById('currentAuthorDisplay').innerHTML = `<span style="color:${myColor}; font-weight:bold;">${myName}</span> <span style="font-size:0.7rem; opacity:0.75;">(${myId})</span>`;
    }

    function openNameModal() {
      document.getElementById('nameInput').value = getUserName();
      document.getElementById('nameModal').style.display = 'flex';
    }

    function saveNameSetting() {
      const input = document.getElementById('nameInput').value.trim();
      const newName = input || '名無し';
      const myId = getOrCreateDeviceId();

      localStorage.setItem('VIL_USER_NAME', newName);

      posts.forEach(p => {
        if (p.userId === myId) p.author = newName;
        if (p.replies) {
          p.replies.forEach(r => {
            if (r.userId === myId) r.author = newName;
          });
        }
      });

      saveLocalPosts();
      updateAuthorDisplay();
      renderTimeline();
      closeModal('nameModal');
    }

    let posts = JSON.parse(localStorage.getItem('VIL_CANVAS_POSTS_V13')) || [];
    let events = JSON.parse(localStorage.getItem('VIL_CANVAS_EVENTS')) || [];
    let activeReplyPostId = null;
    let activeAnimTimers = {};
    let attachedImageData = null;

    let mainCanvas, mainCtx, isDrawing = false, currentStroke = [], mainHistory = [], startTime = 0;
    let fsCanvas, fsCtx, isFsDrawing = false, currentFsStroke = [];
    let replyCanvas, replyCtx, isReplyDrawing = false, currentReplyStroke = [], replyHistory = [], replyStartTime = 0;

    window.onload = function() {
      updateAuthorDisplay();
      initMainCanvas();
      renderTimeline();
      renderCalendar();
      setInterval(autoSyncData, 5000);
    };

    function handleImageSelect(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        attachedImageData = evt.target.result;
        
        const bgImg = document.getElementById('mainBgImage');
        if (bgImg) {
          bgImg.src = attachedImageData;
          bgImg.style.display = 'block';
        }

        const fsBg = document.getElementById('fsBgImage');
        if (fsBg) {
          fsBg.src = attachedImageData;
          fsBg.style.display = 'block';
        }
      };
      reader.readAsDataURL(file);
    }

    function initMainCanvas() {
      const container = document.getElementById('mainCanvasContainer');
      mainCanvas = document.getElementById('mainCanvas');
      mainCanvas.width = container.clientWidth;
      mainCanvas.height = container.clientHeight;

      mainCtx = mainCanvas.getContext('2d');
      mainCtx.lineWidth = 3.5; mainCtx.lineCap = 'round'; mainCtx.strokeStyle = '#3b82f6';

      function getPos(e) {
        const rect = mainCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function startDraw(e) {
        isDrawing = true;
        if (mainHistory.length === 0) startTime = Date.now();
        const pos = getPos(e);
        mainCtx.beginPath(); mainCtx.moveTo(pos.x, pos.y);
        currentStroke = [{ type: 'start', x: pos.x, y: pos.y, t: Date.now() - startTime }];
      }

      function moveDraw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        mainCtx.lineTo(pos.x, pos.y); mainCtx.stroke();
        currentStroke.push({ type: 'move', x: pos.x, y: pos.y, t: Date.now() - startTime });
      }

      function endDraw() {
        if (isDrawing) {
          isDrawing = false;
          if (currentStroke.length > 0) mainHistory.push(currentStroke);
        }
      }

      mainCanvas.addEventListener('mousedown', startDraw); mainCanvas.addEventListener('mousemove', moveDraw); mainCanvas.addEventListener('mouseup', endDraw);
      mainCanvas.addEventListener('touchstart', startDraw); mainCanvas.addEventListener('touchmove', moveDraw); mainCanvas.addEventListener('touchend', endDraw);
    }

    function openFullscreenDraw() {
      document.getElementById('fullscreenDrawModal').style.display = 'flex';
      setTimeout(initFullscreenCanvas, 150);
    }

    function initFullscreenCanvas() {
      const container = document.getElementById('fullscreenCanvasContainer');
      fsCanvas = document.getElementById('fsCanvas');
      fsCanvas.width = container.clientWidth;
      fsCanvas.height = container.clientHeight;

      fsCtx = fsCanvas.getContext('2d');
      fsCtx.lineWidth = 4; fsCtx.lineCap = 'round'; fsCtx.strokeStyle = '#3b82f6';

      if (mainHistory.length > 0) {
        playStrokeAnimation('fsCanvas', mainHistory, '#3b82f6');
      }

      function getPos(e) {
        const rect = fsCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function start(e) {
        isFsDrawing = true;
        if (mainHistory.length === 0) startTime = Date.now();
        const pos = getPos(e);
        fsCtx.beginPath(); fsCtx.moveTo(pos.x, pos.y);
        currentFsStroke = [{ type: 'start', x: pos.x, y: pos.y, t: Date.now() - startTime }];
      }

      function move(e) {
        if (!isFsDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        fsCtx.lineTo(pos.x, pos.y); fsCtx.stroke();
        currentFsStroke.push({ type: 'move', x: pos.x, y: pos.y, t: Date.now() - startTime });
      }

      function end() {
        if (isFsDrawing) {
          isFsDrawing = false;
          if (currentFsStroke.length > 0) mainHistory.push(currentFsStroke);
        }
      }

      fsCanvas.addEventListener('mousedown', start); fsCanvas.addEventListener('mousemove', move); fsCanvas.addEventListener('mouseup', end);
      fsCanvas.addEventListener('touchstart', start); fsCanvas.addEventListener('touchmove', move); fsCanvas.addEventListener('touchend', end);
    }

    function clearFsCanvas() {
      if (fsCtx) fsCtx.clearRect(0, 0, fsCanvas.width, fsCanvas.height);
      clearMainCanvas();
    }

    function closeFullscreenDraw() {
      closeModal('fullscreenDrawModal');
      if (mainHistory.length > 0) {
        playStrokeAnimation('mainCanvas', mainHistory, '#3b82f6');
      }
    }

    /* --- 投稿タップ時の大画面拡大閲覧機能 --- */
    function openViewPostModal(postId) {
      const target = posts.find(p => p.id === postId);
      if (!target) return;

      document.getElementById('viewPostHeaderTitle').innerText = `🔍 ${target.author} さんの投稿`;
      document.getElementById('viewPostModal').style.display = 'flex';

      const container = document.getElementById('viewPostCanvasContainer');
      const cvs = document.getElementById('viewPostCanvas');
      cvs.width = container.clientWidth;
      cvs.height = container.clientHeight;

      const bgImg = document.getElementById('viewPostBgImage');
      if (target.image) {
        bgImg.src = target.image;
        bgImg.style.display = 'block';
      } else {
        bgImg.src = '';
        bgImg.style.display = 'none';
      }

      playStrokeAnimation('viewPostCanvas', target.strokes, '#3b82f6');

      document.getElementById('viewPostReplayBtn').onclick = function() {
        playStrokeAnimation('viewPostCanvas', target.strokes, '#3b82f6');
      };
    }

    function clearMainCanvas() {
      mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
      mainHistory = [];
      attachedImageData = null;
      const bgImg = document.getElementById('mainBgImage');
      if (bgImg) { bgImg.src = ''; bgImg.style.display = 'none'; }
      const fsBg = document.getElementById('fsBgImage');
      if (fsBg) { fsBg.src = ''; fsBg.style.display = 'none'; }
      const fileInp = document.getElementById('imageInput');
      if (fileInp) fileInp.value = '';
    }

    function replayMainCanvas() {
      if (mainHistory.length === 0) return;
      playStrokeAnimation('mainCanvas', mainHistory, '#3b82f6');
    }

    function submitMainPost() {
      if (mainHistory.length === 0 && !attachedImageData) {
        alert('メッセージまたは画像を追加してください。'); return;
      }
      const author = getUserName();
      const userId = getOrCreateDeviceId();
      const newPost = {
        id: 'P_' + Date.now(),
        author: author,
        userId: userId,
        time: new Date().toLocaleString('ja-JP'),
        strokes: mainHistory,
        image: attachedImageData,
        reactions: { '👍': 0, '👌': 0, '🙏': 0 },
        replies: []
      };

      posts.unshift(newPost);
      saveLocalPosts();
      clearMainCanvas();
      renderTimeline();
    }

    /* --- 全アニメーションをブルー（#3b82f6）に統一 --- */
    function playStrokeAnimation(canvasId, strokeHistory, strokeColor = '#3b82f6') {
      const cvs = document.getElementById(canvasId);
      if (!cvs) return;
      const c = cvs.getContext('2d');
      if (activeAnimTimers[canvasId]) cancelAnimationFrame(activeAnimTimers[canvasId]);

      c.clearRect(0, 0, cvs.width, cvs.height);
      c.lineWidth = 3.5; c.lineCap = 'round'; c.strokeStyle = strokeColor;

      let allPoints = [];
      strokeHistory.forEach(s => { allPoints = allPoints.concat(s); });
      if (allPoints.length === 0) return;

      let idx = 0;
      const startT = Date.now();

      function step() {
        const elapsed = Date.now() - startT;
        while (idx < allPoints.length && allPoints[idx].t <= elapsed) {
          const pt = allPoints[idx];
          if (pt.type === 'start') { c.beginPath(); c.moveTo(pt.x, pt.y); }
          else if (pt.type === 'move') { c.lineTo(pt.x, pt.y); c.stroke(); }
          idx++;
        }
        if (idx < allPoints.length) {
          activeAnimTimers[canvasId] = requestAnimationFrame(step);
        }
      }
      activeAnimTimers[canvasId] = requestAnimationFrame(step);
    }

    function deleteMyPost(postId) {
      if (confirm('この投稿を削除しますか？')) {
        posts = posts.filter(p => p.id !== postId);
        saveLocalPosts();
        renderTimeline();
      }
    }

    function deleteMyReply(postId, replyId) {
      if (confirm('このコメントを削除しますか？')) {
        const targetPost = posts.find(p => p.id === postId);
        if (targetPost && targetPost.replies) {
          targetPost.replies = targetPost.replies.filter(r => r.id !== replyId);
          saveLocalPosts();
          renderTimeline();
        }
      }
    }

    function renderTimeline() {
      const container = document.getElementById('timelineContainer');
      const recentPosts = posts.slice(0, 7);
      const myId = getOrCreateDeviceId();

      if (recentPosts.length === 0) {
        container.innerHTML = '<p style="color:var(--sub-text); font-size:0.8rem;">まだ投稿がありません。</p>';
        return;
      }

      container.innerHTML = recentPosts.map((post) => {
        const canvasId = 'postCvs_' + post.id;
        const repliesCount = (post.replies || []).length;
        const userColor = generateVisibleColor(post.userId || 'GUEST');
        const isMyPost = post.userId === myId;

        let repliesHtml = (post.replies || []).map(r => {
          const rColor = generateVisibleColor(r.userId || 'GUEST');
          const isMyReply = r.userId === myId;
          const delReplyBtn = isMyReply ? `<button class="del-btn-sm" onclick="deleteMyReply('${post.id}', '${r.id}')">削除</button>` : '';

          if (r.strokes) {
            const rCvsId = 'replyCvs_' + r.id;
            setTimeout(() => playStrokeAnimation(rCvsId, r.strokes, '#3b82f6'), 100);
            return `<div class="reply-item">
              <div class="reply-header">
                <span style="font-size:0.75rem;"><strong style="color:${rColor};">${r.author}</strong><span class="user-id-badge" style="color:${rColor};">(${r.userId || 'GUEST'})</span> • <span style="color:var(--sub-text);">${r.time}</span></span>
                ${delReplyBtn}
              </div>
              <div style="height:70px; width:100%; position:relative; background:#05070c; border-radius:4px; margin-top:4px; overflow:hidden; border:1px solid var(--reply-blue);">
                <canvas id="${rCvsId}"></canvas>
              </div>
            </div>`;
          } else {
            return `<div class="reply-item">
              <div class="reply-header">
                <span style="font-size:0.75rem;"><strong style="color:${rColor};">${r.author}</strong><span class="user-id-badge" style="color:${rColor};">(${r.userId || 'GUEST'})</span> <span style="font-size:0.65rem; color:var(--sub-text);">(${r.time})</span></span>
                ${delReplyBtn}
              </div>
              <div class="reply-text-content">${r.text}</div>
            </div>`;
          }
        }).join('');

        setTimeout(() => playStrokeAnimation(canvasId, post.strokes, '#3b82f6'), 100);

        const shouldCollapse = repliesCount >= 3;
        const delPostBtn = isMyPost ? `<button class="del-btn-sm" onclick="deleteMyPost('${post.id}')">削除</button>` : '';

        return `
          <div class="post-card">
            <div class="post-header">
              <span class="author-tag" style="color:${userColor};">
                ${post.author}<span class="user-id-badge" style="color:${userColor};">(${post.userId || 'GUEST'})</span>
              </span>
              <div>
                <span style="margin-right:6px;">${post.time}</span>
                ${delPostBtn}
              </div>
            </div>
            <div class="post-body" onclick="openViewPostModal('${post.id}')">
              ${post.image ? `<img src="${post.image}" class="bg-image-preview">` : ''}
              <canvas id="${canvasId}"></canvas>
            </div>
            <div class="reaction-bar">
              <button class="react-btn" onclick="addReaction('${post.id}', '👍')">👍 ${post.reactions ? (post.reactions['👍'] || 0) : 0}</button>
              <button class="react-btn" onclick="addReaction('${post.id}', '👌')">👌 ${post.reactions ? (post.reactions['👌'] || 0) : 0}</button>
              <button class="react-btn" onclick="addReaction('${post.id}', '🙏')">🙏 ${post.reactions ? (post.reactions['🙏'] || 0) : 0}</button>
              <button class="react-btn" onclick="triggerReplay('${post.id}')">▶ 再生</button>
              <button class="react-btn" style="color:var(--reply-blue); border-color:var(--reply-blue);" onclick="openReplyModal('${post.id}')">💬 返信</button>
            </div>
            
            ${repliesCount > 0 ? `
              <button class="toggle-reply-btn" onclick="toggleReplies('${post.id}')">
                💬 コメントを見る (${repliesCount}件) ${shouldCollapse ? '▼' : '▲'}
              </button>
              <div class="replies-container ${shouldCollapse ? '' : 'open'}" id="replies_${post.id}">
                ${repliesHtml}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function toggleReplies(postId) {
      const el = document.getElementById('replies_' + postId);
      if (el) el.classList.toggle('open');
    }

    function triggerReplay(postId) {
      const target = posts.find(p => p.id === postId);
      if (target) playStrokeAnimation('postCvs_' + postId, target.strokes, '#3b82f6');
    }

    function addReaction(postId, emoji) {
      const target = posts.find(p => p.id === postId);
      if (target) {
        if (!target.reactions) target.reactions = {};
        target.reactions[emoji] = (target.reactions[emoji] || 0) + 1;
        saveLocalPosts();
        renderTimeline();
      }
    }

    function openReplyModal(postId) {
      activeReplyPostId = postId;
      document.getElementById('replyTextInput').value = '';
      document.getElementById('replyDrawModal').style.display = 'flex';
      setTimeout(initReplyCanvas, 150);
    }

    function submitTextReply() {
      const text = document.getElementById('replyTextInput').value.trim();
      if (!text) return;
      const target = posts.find(p => p.id === activeReplyPostId);
      if (target) {
        if (!target.replies) target.replies = [];
        target.replies.push({
          id: 'R_' + Date.now(),
          author: getUserName(),
          userId: getOrCreateDeviceId(),
          time: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
          text: text
        });
        saveLocalPosts();
        closeModal('replyDrawModal');
        renderTimeline();
        setTimeout(() => {
          const el = document.getElementById('replies_' + activeReplyPostId);
          if (el) el.classList.add('open');
        }, 150);
      }
    }

    function initReplyCanvas() {
      const container = document.getElementById('replyCanvasContainer');
      replyCanvas = document.getElementById('replyCanvas');
      replyCanvas.width = container.clientWidth;
      replyCanvas.height = container.clientHeight;
      replyCtx = replyCanvas.getContext('2d');
      replyCtx.lineWidth = 3; replyCtx.lineCap = 'round'; replyCtx.strokeStyle = '#3b82f6';
      replyHistory = [];

      function getPos(e) {
        const rect = replyCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function start(e) {
        isReplyDrawing = true;
        if (replyHistory.length === 0) replyStartTime = Date.now();
        const pos = getPos(e);
        replyCtx.beginPath(); replyCtx.moveTo(pos.x, pos.y);
        currentReplyStroke = [{ type: 'start', x: pos.x, y: pos.y, t: Date.now() - replyStartTime }];
      }

      function move(e) {
        if (!isReplyDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        replyCtx.lineTo(pos.x, pos.y); replyCtx.stroke();
        currentReplyStroke.push({ type: 'move', x: pos.x, y: pos.y, t: Date.now() - replyStartTime });
      }

      function end() {
        if (isReplyDrawing) {
          isReplyDrawing = false;
          if (currentReplyStroke.length > 0) replyHistory.push(currentReplyStroke);
        }
      }

      replyCanvas.addEventListener('mousedown', start); replyCanvas.addEventListener('mousemove', move); replyCanvas.addEventListener('mouseup', end);
      replyCanvas.addEventListener('touchstart', start); replyCanvas.addEventListener('touchmove', move); replyCanvas.addEventListener('touchend', end);
    }

    function clearReplyCanvas() {
      if (replyCtx) replyCtx.clearRect(0, 0, replyCanvas.width, replyCanvas.height);
      replyHistory = [];
    }

    function replayReplyCanvas() {
      if (replyHistory.length === 0) return;
      playStrokeAnimation('replyCanvas', replyHistory, '#3b82f6');
    }

    function submitReplyDraw() {
      if (replyHistory.length === 0) return;
      const target = posts.find(p => p.id === activeReplyPostId);
      if (target) {
        if (!target.replies) target.replies = [];
        target.replies.push({
          id: 'R_' + Date.now(),
          author: getUserName(),
          userId: getOrCreateDeviceId(),
          time: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
          strokes: replyHistory
        });
        saveLocalPosts();
        closeModal('replyDrawModal');
        clearReplyCanvas();
        renderTimeline();
        setTimeout(() => {
          const el = document.getElementById('replies_' + activeReplyPostId);
          if (el) el.classList.add('open');
        }, 150);
      }
    }

    function openArchiveModal() {
      document.getElementById('archiveModal').style.display = 'flex';
      const container = document.getElementById('archiveContainer');
      const archivePosts = posts.slice(7);
      const myId = getOrCreateDeviceId();

      if (archivePosts.length === 0) {
        container.innerHTML = '<p style="color:var(--sub-text); font-size:0.8rem;">8件目以降の過去投稿はまだありません。</p>';
        return;
      }

      container.innerHTML = archivePosts.map((post) => {
        const canvasId = 'archCvs_' + post.id;
        const userColor = generateVisibleColor(post.userId || 'GUEST');
        const isMyPost = post.userId === myId;
        const delPostBtn = isMyPost ? `<button class="del-btn-sm" onclick="deleteMyPost('${post.id}')">削除</button>` : '';

        setTimeout(() => playStrokeAnimation(canvasId, post.strokes, '#3b82f6'), 100);
        return `
          <div class="post-card">
            <div class="post-header">
              <strong style="color:${userColor};">${post.author}<span class="user-id-badge" style="color:${userColor};">(${post.userId || 'GUEST'})</span></strong>
              <div>
                <span style="margin-right:6px;">${post.time}</span>
                ${delPostBtn}
              </div>
            </div>
            <div class="post-body" onclick="openViewPostModal('${post.id}')">
              ${post.image ? `<img src="${post.image}" class="bg-image-preview">` : ''}
              <canvas id="${canvasId}"></canvas>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderCalendar() {
      const now = new Date();
      const year = now.getFullYear(); const month = now.getMonth();
      document.getElementById('calMonth').innerText = `${year}年 ${month + 1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const body = document.getElementById('calBody');
      body.innerHTML = '';

      for (let i = 0; i < firstDay; i++) { body.appendChild(document.createElement('div')); }

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        if (day === now.getDate()) cell.classList.add('today');
        cell.innerText = day;

        const hasEv = events.some(e => e.date === dateStr);
        if (hasEv) {
          const dot = document.createElement('div'); dot.className = 'event-dot'; cell.appendChild(dot);
        }

        cell.onclick = () => {
          document.getElementById('evtDate').value = dateStr;
          openAddEventModal();
        };
        body.appendChild(cell);
      }
    }

    function openAddEventModal() {
      if (!document.getElementById('evtDate').value) {
        document.getElementById('evtDate').value = new Date().toISOString().split('T')[0];
      }
      document.getElementById('eventModal').style.display = 'flex';
      renderEventList();
    }

    function saveEvent(e) {
      e.preventDefault();
      const date = document.getElementById('evtDate').value;
      const title = document.getElementById('evtTitle').value;
      events.push({ id: 'E_' + Date.now(), date: date, title: title });
      localStorage.setItem('VIL_CANVAS_EVENTS', JSON.stringify(events));
      document.getElementById('evtTitle').value = '';
      closeModal('eventModal');
      renderCalendar();
    }

    function deleteEvent(eventId) {
      events = events.filter(e => e.id !== eventId);
      localStorage.setItem('VIL_CANVAS_EVENTS', JSON.stringify(events));
      renderEventList();
      renderCalendar();
    }

    function renderEventList() {
      const container = document.getElementById('eventListContainer');
      if (events.length === 0) {
        container.innerHTML = '<p style="color:var(--sub-text); font-size:0.75rem;">登録されている予定はありません。</p>';
        return;
      }
      container.innerHTML = events.map(e => `
        <div style="background:#05070c; padding:6px 10px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; font-size:0.8rem;">
          <span><strong>${e.date}</strong>: ${e.title}</span>
          <button class="icon-btn" style="color:var(--accent-red);" onclick="deleteEvent('${e.id}')">削除</button>
        </div>
      `).join('');
    }

    function autoSyncData() {
      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ posts: posts, events: events })
      })
      .then(res => res.json())
      .then(res => {
        if (res.posts && res.posts.length !== posts.length) {
          posts = res.posts;
          saveLocalPosts();
          renderTimeline();
          document.getElementById('globalNewBadge').style.display = 'inline-block';
          sendPushNotification("新着投稿あり", "手書き掲示板に新しい投稿が届きました！");
        }
      })
      .catch(() => {});
    }

    function saveLocalPosts() {
      localStorage.setItem('VIL_CANVAS_POSTS_V13', JSON.stringify(posts));
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function requestNotificationPermission() {
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') alert('通知をオンにしました！');
          else alert('通知がブロックされました。');
        });
      }
    }

    function sendPushNotification(title, body) {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, { body: body, icon: '✍️' });
      }
    }
  </script>
</body>
